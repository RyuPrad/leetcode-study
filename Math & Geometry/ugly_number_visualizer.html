<body>
  <h1 class="page-title">263. Ugly Number</h1>
  <div id="drag-container">
    <div><button id="btn-prev" onclick="prevStep()">Back</button><button id="btn-next" onclick="nextStep()">Step Over</button><button id="btn-reset" onclick="init()">Reset</button><button id="btn-fullscreen" onclick="document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()">Fullscreen</button></div>
    <div><button id="btn-ex-1" onclick="loadExample(1)">LeetCode example</button><button id="btn-ex-2" onclick="loadExample(2)">Many factors</button><button id="btn-ex-3" onclick="loadExample(3)">Other prime</button><button id="btn-ex-4" onclick="loadExample(4)">One</button></div>
    <div><label for="custom-input">n</label><input id="custom-input" value="6" /><button onclick="loadCustom()">Load</button></div>
  </div>
  <div class="layout">
    <div class="panel"><h2>Divide out 2, 3 and 5</h2><div id="narration-ui"></div><div id="visual-ui"></div><div id="final-ui" class="result-value"></div></div>
    <div class="panel code-panel"><h2>Live Debugger</h2><div id="reference-code">
<div id="line-1" class="code-line"><span class="kw">var</span> isUgly = <span class="kw">function</span>(n) {</div>
<div id="line-2" class="code-line">  <span class="kw">if</span> (n &lt;= <span class="num">0</span>) {</div>
<div id="line-3" class="code-line">    <span class="kw">return</span> <span class="kw">false</span>;</div>
<div id="line-4" class="code-line">  }</div>
<div id="line-5" class="code-line">  <span class="kw">for</span> (<span class="kw">const</span> p <span class="kw">of</span> [<span class="num">2</span>, <span class="num">3</span>, <span class="num">5</span>]) {</div>
<div id="line-6" class="code-line">    <span class="kw">while</span> (n % p === <span class="num">0</span>) {</div>
<div id="line-7" class="code-line">      n /= p;</div>
<div id="line-8" class="code-line">    }</div>
<div id="line-9" class="code-line">  }</div>
<div id="line-10" class="code-line">  <span class="kw">return</span> n === <span class="num">1</span>;</div>
<div id="line-11" class="code-line">};</div>
    </div></div>
    <div class="panel"><h2>Object View — nested JS object format (debugger-style)</h2><div id="object-view"></div></div>
    <div class="panel"><h2>Variables & Outputs</h2><div id="console-ui" class="console"></div></div>
    <div class="panel"><h2>Operation Trace</h2><div id="trace-ui"></div></div>
  </div>
  <script>
    const examples={1:6,2:300,3:14,4:1};
    let start=6,steps=[],stepIndex=0;
    function buildSteps(){
      steps=[];const v={n:start},rec=StudyKit.recorder(steps,()=>v);let at=-1;
      const snap=(line,phase,text,extra={})=>rec.snap(line,phase,text,{view:{at},...extra});
      snap(null,'ready','Is '+start+' built only from the primes 2, 3 and 5?');
      const bad=v.n<=0;snap(2,'guard',bad?v.n+' is not positive.':v.n+' is positive.');
      if(bad){snap(3,'return-false','Return false.',{returned:false});rec.finish();return;}
      const primes=[2,3,5];
      for(at=0;at<=3;at++){
        if(at===3){delete v.p;snap(5,'loop-end','2, 3 and 5 are divided out.');break;}
        v.p=primes[at];snap(5,'next-prime','p = '+v.p+'.');
        while(true){
          const divides=v.n%v.p===0;snap(6,'check',divides?v.n+' % '+v.p+' = 0: '+v.p+' divides n.':v.n+' % '+v.p+' = '+(v.n%v.p)+': no more factors of '+v.p+'.');
          if(!divides)break;
          const before=v.n;v.n/=v.p;rec.log({divide:before+' / '+v.p,n:String(v.n)});snap(7,'divide','n = '+before+' / '+v.p+' = '+v.n+'.');
        }
      }
      at=-1;
      const res=v.n===1;snap(10,'return',res?'Only 1 is left: every factor was 2, 3 or 5. Return true.':v.n+' is left, so n has another prime factor. Return false.',{returned:res});
      rec.finish();
    }
    function render(){
      const state=steps[stepIndex],at=state.view.at;
      const cls=k=>k<at||state.phase==='loop-end'||state.phase==='return'&&state.n===1?'complete':k===at&&state.phase==='check'?'read':'';
      const visual=StudyKit.array([2,3,5],{scope:'primes',label:'allowed primes',cls,pointers:at>=0&&at<3?{p:at}:{},indices:false})+'<p>n = '+state.n+'</p>';
      StudyKit.render(state,stepIndex,steps.length,{visual,result:state.finished?'return '+state.returned:''});
    }
    function loadExample(number){start=examples[number];document.getElementById('custom-input').value=String(start);init();}
    function loadCustom(){try{start=StudyKit.parseInteger(document.getElementById('custom-input').value,{low:-2147483648,high:2147483647,name:'n'});init();}catch(error){alert(error.message);}}

    function init(){buildSteps();stepIndex=0;render();}
    function nextStep(){if(stepIndex<steps.length-1){stepIndex++;render();}}
    function prevStep(){if(stepIndex>0){stepIndex--;render();}}
    init();

    // STUDY LESSON BRIDGE START
    window.studyLessonSource = {
      spec: {"number":263,"title":"Ugly Number","topic":"Math & Geometry","why":"An ugly number is 2^a × 3^b × 5^c. Dividing out every factor of 2, 3 and 5 leaves 1 exactly when no other prime divides n.","meanings":{"n":"what remains after dividing out the allowed primes","p":"prime being divided out"},"entityClasses":["kit-slot","kit-cell","tree-node","list-node","map-item","stack-item","grid-cell","tree-slot","stack-slot"],"entitySelectors":[],"mode":"precomputed"},
      index:()=>stepIndex,count:()=>steps.length,read:()=>steps[stepIndex],readAt:index=>steps[index],
      phases:()=>steps.map((state,index)=>({index,phase:state.phase})),
      jump:index=>{stepIndex=Math.max(0,Math.min(steps.length-1,index));render();},
      objectFrame(index=stepIndex){return StudyKit.objectFrame(steps[index],"isUgly");}
    };
    // STUDY LESSON BRIDGE END
</script>
