name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check:content
      - run: npm test
      - run: npm run test:visualizers
      - run: npm run test:lessons
      - run: npm run test:guided
      - run: npm run test:operations
      - run: npm run test:inputs
      - run: npm run test:playback
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:coding
      - run: npm run test:editor
      - run: npm run check:debugger
      - run: npm run test:debugger
      - run: npm run test:guided:desktop
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LeetCode-Study-Windows-x64
          path: release/*Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: test-results/
