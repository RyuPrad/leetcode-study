name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check:content
      # Unit and lesson checks consume the generated catalog and offline rules.
      - run: npm run build
      - run: npm test
      - run: npm run test:ported
      - run: npm run test:visualizers
      - run: npm run test:lessons
      - run: npm run test:objects
      - run: npm run test:layout
      - run: npm run test:panels
      - run: npm run test:motion
      - run: npm run test:guided
      - run: npm run test:operations
      - run: npm run test:instructions
      - run: npm run test:presets
      - run: node tests/permutation-history.mjs
      - run: npm run test:oracles
      - run: npm run test:inputs
      - run: npm run test:playback
      - run: npm run test:e2e
      - run: node tests/restore-isolation.e2e.mjs
      - run: npm run test:motion:desktop
      - run: npm run test:objects:desktop
      - run: npm run test:objects:readability:desktop
      - run: npm run test:layout:desktop
      - run: npm run test:panels:desktop
      - run: npm run test:coding
      - run: npm run test:editor
      - run: npm run check:debugger
      - run: npm run test:debugger
      - run: npm run test:guided:desktop
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LeetCode-Study-Windows-x64
          path: release/*Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: test-results/
